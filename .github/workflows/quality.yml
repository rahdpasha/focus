name: Quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Guard client secrets
        run: |
          if grep -RInE 'GEMINI_API_KEY|SUPABASE_SERVICE_ROLE|VITE_[A-Z0-9_]*SERVICE_ROLE|VITE_GEMINI' src public index.html .env.example; then
            echo "Forbidden server secret reference found in client-shipped files."
            exit 1
          fi

      - name: Build
        run: npm run build
