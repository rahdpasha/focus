name: Muse database contract
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: disposable-test-only
          POSTGRES_DB: muse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: muse_test
      PGUSER: postgres
      PGPASSWORD: disposable-test-only
    steps:
      - uses: actions/checkout@v4
      - name: Test Muse migration with isolated identities
        run: psql -X -v ON_ERROR_STOP=1 -f tests/database/muse.sql
